# Render Blueprint — deploys the real Jarvis server for free.
# On https://render.com → New → Blueprint → connect this repo.
services:
  - type: web
    name: jarvis-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: API_HOST
        value: "0.0.0.0"
      - key: AUTO_OPEN_BROWSER
        value: "False"
      - key: LLM_PROVIDER
        value: "auto"          # free AI, no key needed (add a Groq key to override)
      - key: LLM_API_KEY
        value: ""
